name: Daily Build llama.cpp for S905X3 (ARM64)

on:
  schedule:
    - cron: '17 2 * * *'          # 避开整点高峰，减少被丢弃的概率
  workflow_dispatch:

permissions:
  contents: read                   # 降低默认 GITHUB_TOKEN 权限，推送用 PAT

jobs:
  preflight:
    runs-on: ubuntu-24.04-arm
    outputs:
      pat_ok: ${{ steps.check_pat.outputs.ok }}
    steps:
      - name: Verify PAT is configured
        id: check_pat
        env:
          PAT: ${{ secrets.MY_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::MY_PAT secret is not set. Create a fine-grained PAT with Contents:write + Workflows:write and add it as the MY_PAT repository secret."
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "ok=true" >> $GITHUB_OUTPUT

  check-and-build:
    needs: preflight
    if: needs.preflight.outputs.pat_ok == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.MY_PAT }}
          persist-credentials: false   # 不让 checkout 的 GITHUB_TOKEN 覆盖 PAT

      - name: Configure git auth explicitly
        env:
          PAT: ${{ secrets.MY_PAT }}
        run: |
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git
          git fetch upstream

      - name: Check for upstream updates
        id: check_updates
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/master)
          if [ "$LOCAL" != "$UPSTREAM" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync master with upstream
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          git checkout -B master upstream/master
          git push --force origin master

      - name: Install dependencies
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git ninja-build gcc-14 g++-14 libcurl4-openssl-dev

      - name: Configure CMake
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CPU=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_CPU_ARM_ARCH="armv8.2-a+dotprod+fp16" \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_LTO=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_CCACHE=OFF \
            -DCMAKE_C_FLAGS_RELEASE="-march=armv8.2-a+dotprod+fp16 -O3" \
            -DCMAKE_CXX_FLAGS_RELEASE="-march=armv8.2-a+dotprod+fp16 -O3"

      - name: Build llama-server
        if: steps.check_updates.outputs.has_updates == 'true'
        run: cmake --build build --config Release -j $(nproc) --target llama-server

      - name: Upload artifact
        if: steps.check_updates.outputs.has_updates == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: llama-server-s905x3-arm64
          path: build/bin/llama-server
          retention-days: 7
