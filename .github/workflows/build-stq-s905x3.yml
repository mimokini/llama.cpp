name: Manual Build llama.cpp STQ for S905X3 (ARM64)

on:
  workflow_dispatch:
    inputs:
      stq_pr_ref:
        description: 'STQ PR ref to cherry-pick'
        required: false
        default: 'pull/22836/head'
      stq_fallback_ref:
        description: 'Fallback ref if PR ref fails (author branch)'
        required: false
        default: 'sjl623/stq1_0'
      base_ref:
        description: 'Base ref to build on (must include MiniCPM5 support)'
        required: false
        default: 'master'

permissions:
  contents: read

jobs:
  build-stq:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository (workflow context only)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Add remotes
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git || true
          git remote add sjl623   https://github.com/sjl623/llama.cpp.git   || true

      # ---------- 1. 基于最新 master 创建构建分支 ----------
      - name: Create build branch from latest upstream base
        run: |
          BASE_REF="${{ github.event.inputs.base_ref }}"
          git fetch upstream "${BASE_REF}"
          git checkout -B stq-build FETCH_HEAD
          echo "✅ Base: $(git rev-parse --short HEAD)  $(git log -1 --pretty=%s)"

      # ---------- 2. 获取 STQ PR 源码 ----------
      - name: Fetch STQ PR source (with fallback)
        id: fetch_stq
        run: |
          STQ_PR_REF="${{ github.event.inputs.stq_pr_ref }}"
          FALLBACK_REF="${{ github.event.inputs.stq_fallback_ref }}"
          FALLBACK_REMOTE="${FALLBACK_REF%%/*}"
          FALLBACK_BRANCH="${FALLBACK_REF#*/}"

          if git fetch upstream "${STQ_PR_REF}:refs/heads/stq-source" 2>/dev/null; then
            echo "source=pr" >> $GITHUB_OUTPUT
          else
            git fetch "${FALLBACK_REMOTE}" "${FALLBACK_BRANCH}:refs/heads/stq-source"
            echo "source=fallback" >> $GITHUB_OUTPUT
          fi

      # ---------- 3. Cherry-pick STQ 提交，自动解决冲突 ----------
      - name: Cherry-pick STQ commits with conflict resolution
        run: |
          set -e
          MERGE_BASE=$(git merge-base stq-build stq-source)
          COMMITS=$(git log --oneline --reverse "${MERGE_BASE}..stq-source")
          
          echo "Commits to cherry-pick:"
          echo "$COMMITS"
          echo ""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            SHA=$(echo "$line" | awk '{print $1}')
            echo "Cherry-picking ${SHA} ..."
            
            if git cherry-pick "$SHA"; then
              echo "  ✅ Clean apply"
            else
              echo "  ⚠️ Conflict detected, resolving by taking STQ version"
              # 冲突文件采用 STQ 分支（--theirs）的版本
              git diff --name-only --diff-filter=U | while read -r f; do
                echo "    Resolving $f (taking theirs)"
                git checkout --theirs -- "$f"
                git add "$f"
              done
              # 完成 cherry-pick
              git cherry-pick --continue --no-edit
              echo "  ✅ Resolved"
            fi
          done <<< "$COMMITS"

          echo ""
          echo "✅ All commits applied. Final: $(git log -1 --pretty='%h %s')"

      # ---------- 4. 编译 ----------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git ninja-build gcc-14 g++-14 libcurl4-openssl-dev

      - name: Configure CMake (STQ kernel, S905X3 optimized)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CPU=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_CPU_ARM_ARCH="armv8.2-a+dotprod+fp16" \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_LTO=ON \
            -DGGML_OPENMP=ON \
            -DGGML_CCACHE=OFF \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_FLAGS_RELEASE="-march=armv8.2-a+dotprod+fp16 -O3" \
            -DCMAKE_CXX_FLAGS_RELEASE="-march=armv8.2-a+dotprod+fp16 -O3"

      - name: Build llama-server
        run: cmake --build build --config Release -j $(nproc) --target llama-server

      - name: Verify STQ symbols
        run: |
          ls -lh build/bin/llama-server
          if strings build/bin/llama-server | grep -Eqi "stq1_0"; then
            echo "✅ STQ1_0 symbols found"
          else
            echo "⚠️ STQ symbols not found by strings"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-server-stq-s905x3-arm64
          path: build/bin/llama-server
          retention-days: 7
