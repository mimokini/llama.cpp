name: Manual Build llama.cpp STQ for S905X3 (ARM64)

on:
  workflow_dispatch:
    inputs:
      stq_pr_ref:
        description: 'STQ PR ref to cherry-pick'
        required: false
        default: 'pull/22836/head'
      stq_fallback_ref:
        description: 'Fallback ref if PR ref fails (author branch)'
        required: false
        default: 'sjl623/stq1_0'
      base_ref:
        description: 'Base ref to build on (must include MiniCPM5 support)'
        required: false
        default: 'master'

permissions:
  contents: read

jobs:
  build-stq:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository (workflow context only)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add remotes
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git || true
          git remote add sjl623   https://github.com/sjl623/llama.cpp.git   || true
          git remote -v

      # ---------- 1. 基于最新 master 创建构建分支 ----------
      - name: Create build branch from latest upstream base
        id: base
        run: |
          BASE_REF="${{ github.event.inputs.base_ref }}"
          echo "== Fetching upstream ${BASE_REF} =="
          git fetch upstream "${BASE_REF}"
          git checkout -B stq-build FETCH_HEAD
          echo "base_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "✅ Base: $(git rev-parse --short HEAD)  $(git log -1 --pretty=%s)"

      # ---------- 2. 获取 STQ PR 源码 ----------
      - name: Fetch STQ PR source (with fallback)
        id: fetch_stq
        run: |
          STQ_PR_REF="${{ github.event.inputs.stq_pr_ref }}"
          FALLBACK_REF="${{ github.event.inputs.stq_fallback_ref }}"
          FALLBACK_REMOTE="${FALLBACK_REF%%/*}"
          FALLBACK_BRANCH="${FALLBACK_REF#*/}"

          echo "== Trying official PR ref: upstream ${STQ_PR_REF} =="
          if git fetch upstream "${STQ_PR_REF}:refs/heads/stq-source" 2>/dev/null; then
            echo "source=pr" >> $GITHUB_OUTPUT
            echo "✅ Fetched ${STQ_PR_REF} into stq-source"
          else
            echo "⚠️ PR ref fetch failed, trying ${FALLBACK_REF}"
            git fetch "${FALLBACK_REMOTE}" "${FALLBACK_BRANCH}:refs/heads/stq-source"
            echo "source=fallback" >> $GITHUB_OUTPUT
            echo "✅ Fetched ${FALLBACK_REF} into stq-source"
          fi

      # ---------- 3. Cherry-pick STQ 提交，自动解决冲突 ----------
      - name: Cherry-pick STQ commits with conflict resolution
        run: |
          set -e
          echo "== STQ source: $(git log -1 --pretty='%h %s' stq-source) =="

          MERGE_BASE=$(git merge-base stq-build stq-source)
          echo "Merge base: ${MERGE_BASE:0:7}"

          COMMITS=$(git log --oneline --reverse "${MERGE_BASE}..stq-source")
          COUNT=$(echo "$COMMITS" | wc -l)
          echo "Commits to cherry-pick: $COUNT"
          echo "$COMMITS"
          echo ""

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No commits found between base and STQ source"
            exit 1
          fi

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            SHA=$(echo "$line" | awk '{print $1}')
            echo "Cherry-picking ${SHA} ..."

            if git cherry-pick "$SHA"; then
              echo "  ✅ Clean apply"
            else
              echo "  ⚠️ Conflict detected, resolving by taking STQ version"
              git diff --name-only --diff-filter=U | while read -r f; do
                echo "    Resolving $f (taking theirs)"
                git checkout --theirs -- "$f"
                git add "$f"
              done
              git cherry-pick --continue --no-edit
              echo "  ✅ Resolved"
            fi
          done <<< "$COMMITS"

          echo ""
          echo "✅ All commits applied. Final: $(git log -1 --pretty='%h %s')"

      # ---------- 4. 修补 GGML_TYPE_COUNT（关键：避免张量类型越界） ----------
      - name: Fix GGML_TYPE_COUNT for STQ1_0
        run: |
          set -e
          TYPE_HEADER="ggml/include/ggml.h"

          echo "== Before fix =="
          grep -n "GGML_TYPE_COUNT" "$TYPE_HEADER" || true
          grep -n "GGML_TYPE_STQ1_0" "$TYPE_HEADER" || true

          # 取出 STQ1_0 的枚举值（去掉尾部逗号）
          STQ_VALUE=$(grep -E "GGML_TYPE_STQ1_0\s*=" "$TYPE_HEADER" | head -1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          COUNT_VALUE=$(grep -E "GGML_TYPE_COUNT\s*=" "$TYPE_HEADER" | head -1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          echo "STQ1_0 value = ${STQ_VALUE:-<missing>}"
          echo "GGML_TYPE_COUNT value = ${COUNT_VALUE:-<missing>}"

          if [ -z "${STQ_VALUE:-}" ]; then
            echo "::error::GGML_TYPE_STQ1_0 not found in $TYPE_HEADER; cherry-pick may have failed"
            exit 1
          fi

          # 目标：COUNT 必须 > STQ 值。否则把 COUNT 设为 STQ+1
          EXPECTED=$((STQ_VALUE + 1))
          if [ -z "${COUNT_VALUE:-}" ] || [ "$COUNT_VALUE" -le "$STQ_VALUE" ]; then
            echo "→ Adjusting GGML_TYPE_COUNT to $EXPECTED"
            sed -i -E "s/GGML_TYPE_COUNT\s*=\s*[0-9]+/GGML_TYPE_COUNT = ${EXPECTED}/" "$TYPE_HEADER"
          else
            echo "→ GGML_TYPE_COUNT ($COUNT_VALUE) already > STQ1_0 ($STQ_VALUE), no change needed"
          fi

          echo "== After fix =="
          grep -n "GGML_TYPE_COUNT" "$TYPE_HEADER" || true

      # ---------- 5. 编译 ----------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git ninja-build \
            gcc-14 g++-14 libcurl4-openssl-dev

      - name: Configure CMake (STQ kernel, S905X3 optimized)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CPU=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_CPU_ARM_ARCH="armv8.2-a+dotprod+fp16" \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_LTO=ON \
            -DGGML_OPENMP=ON \
            -DGGML_CCACHE=OFF \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_C_FLAGS_RELEASE="-march=armv8.2-a+dotprod+fp16 -O3" \
            -DCMAKE_CXX_FLAGS_RELEASE="-march=armv8.2-a+dotprod+fp16 -O3"

      - name: Build llama-server
        run: |
          cmake --build build --config Release -j $(nproc) --target llama-server

      - name: Verify STQ, MiniCPM5 and TYPE_COUNT readiness
        run: |
          echo "=== Binary info ==="
          ls -lh build/bin/llama-server
          file build/bin/llama-server

          echo ""
          echo "=== STQ1_0 symbol check ==="
          if strings build/bin/llama-server | grep -Eqi "stq1_0|stq_0"; then
            echo "✅ STQ1_0 symbols found"
          else
            echo "⚠️ STQ symbols not found by strings"
          fi

          echo ""
          echo "=== MiniCPM5 tokenizer/parser readiness ==="
          if strings build/bin/llama-server | grep -qi "minicpm5"; then
            echo "✅ MiniCPM5 related strings found (tokenizer/parser likely present)"
          else
            echo "⚠️ No MiniCPM5 strings found; base_ref may be too old for MiniCPM5 support"
          fi

          echo ""
          echo "=== GGML_TYPE_COUNT check (post-build source) ==="
          grep -n "GGML_TYPE_COUNT" ggml/include/ggml.h || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-server-stq-s905x3-arm64
          path: build/bin/llama-server
          retention-days: 7
